# ============================================================================
#  PEGen config — MSS301 Microservices scaffolder
#  Sửa file này theo ĐỀ BÀI mới rồi chạy lại generator. KHÔNG cần sửa PEGen.java.
#
#  >>> Chú thích [..] = LẤY Ở ĐÂU TRONG ĐỀ:
#     [BẠN] = MSSV của bạn (đề chỉ ghi <StudentID>, không cho sẵn)
#     [Head]= dòng "Project Name" / "Controller Class" ở đầu mỗi mục service
#     [Cfg] = mục "Configuration for application.properties"
#     [DTO] = mục "Data Transfer Objects (DTOs)"
#     [API] = mục "API Endpoints"
#     [DB]  = mục "Database Structure" (bảng liệt kê cột)  <-- quan trọng nhất
#     [2.5] = mục "2.5 Project structure requirements"
#     ⚠️    = SAI LÀ 0 ĐIỂM (phải khớp tuyệt đối với đề)
#
#  Quy tắc field DSL:  <kind>,<flag>,<key=val>,...
#    kind : string | date | datetime | int | long | status | enum=A|B|C
#    flag : required | unique | email
#    key  : max=N | column=ten_cot | pattern=REGEX | after=yyyy-MM-dd
#           beforeDays=N | geField=tenFieldKhac | fk=bang.cot | enforceFk=true|false
#           sql=INT|BIGINT|DATE|DATETIME2|VARCHAR|NVARCHAR|... | json=dd/MM/yyyy
#  (enum dùng dấu | ngăn cách; pattern KHÔNG được chứa dấu phẩy)
# ============================================================================
# ----- Toàn cục -----
# [BẠN] MSSV của bạn — viết thường cho studentId, viết HOA cho projectPrefix
studentId=se180211
projectPrefix=SE180211
# [2.5] "fu.<studentId>.<servicename>"
groupId=fu.se180211
# [Head] dòng "Framework: Spring Boot 3.5.11"
springBootVersion=3.5.11
# [Head] "Spring Cloud Gateway 2025" -> bản 2025.0.x
springCloudVersion=2025.0.2
# (cố định) thư viện Swagger/SpringDoc
springdocVersion=2.8.14
# (tùy bạn) nơi sinh dự án ra
outputDir=PEGEN_OUTPUT
# Department/Employee exam uses status + data + ISO-8601 timestamp.
api.response.style=timestamp
# ----- Database ----- (đọc ở [Cfg])
# ⚠️[Cfg] "Database name" / databaseName=...
db.name=MSS301_2026_PE
# ⚠️[Cfg] URL: jdbc:sqlserver://localhost:1433
db.host=localhost
db.port=1433
# ⚠️[Cfg] username / password
db.user=sa
db.password=sa
# ============================================================================
#  SERVICE A — service "gốc" (kiểu Department): có unique code, soft-delete
# ============================================================================
# ⚠️[Head] "Project Name: <StudentID>DepartmentService"
a.project=SE180211DepartmentService
# ⚠️[2.5] servicename = department/employee/gateway
a.pkg=department
# ⚠️[Cfg] "server.port 8081"
a.port=8081
# [DTO] tên DTO bỏ "DTO" (DepartmentDTO -> Department)
a.entity=Department
# ⚠️[DB] "Table Name: departments"
a.table=departments
# [DTO] field id ; ⚠️[DB] cột id (Identity)
a.id.name=departmentId
a.id.column=department_id
a.id.sqlType=INT
# ⚠️[API] đường dẫn: "POST /api/departments"
a.basePath=/api/departments
# ⚠️[Head] "Controller Class: <StudentID>DepartmentController"
a.controller=SE180211DepartmentController
# [API] Get List -> "Filter by name" (tên field dùng để lọc)
a.list.nameField=name
a.list.filters=name:name,status:status:status
# [DTO]/[DB] field status
a.status.field=status
# [DTO] "(ACTIVE, INACTIVE, CLOSED)"
a.status.values=ACTIVE,INACTIVE,CLOSED
# [API] Create: "default status ... is ACTIVE"
a.status.default=ACTIVE
a.status.defaultOnCreate=true
# [API] Deactivate: "Sets ... status to INACTIVE"
a.status.inactive=INACTIVE
# ⚠️[DB] MỖI DÒNG dưới = 1 dòng trong bảng "Database Structure"
#   (Field Name -> column=, Type -> string/date/long, Mandatory Yes -> required,
#    Max Len -> max=, Unique -> unique, "chỉ A-Z a-z 0-9" -> pattern=...)
a.fields=code,name,location,status,effectiveDate,parentId
# code | Nvarchar | 10 | Yes | Unique, chỉ A-Z a-z 0-9
a.field.code=string,pattern=^[A-Za-z0-9]+$,required,unique,max=10,sql=NVARCHAR,column=code
# name | Nvarchar | 50 | Yes
a.field.name=string,required,max=50,sql=NVARCHAR,column=name
# location | Nvarchar | 100 | (không Yes -> không required)
a.field.location=string,max=100,sql=NVARCHAR,column=location
# status | Nvarchar | 10 | (ACTIVE, INACTIVE, CLOSED)
a.field.status=status,max=10,sql=NVARCHAR,column=status
# effective_date | Date | "sau 2000/01/01 và trước hôm nay+360"
a.field.effectiveDate=date,json=dd/MM/yyyy,after=2000-01-01,beforeDays=360,sql=DATE,column=effective_date
# parent_id | int | (khóa ngoại tự tham chiếu departments)
a.field.parentId=long,sql=INT,fk=departments.department_id,enforceFk=false,column=parent_id
# ============================================================================
#  SERVICE B — service "phụ thuộc" (kiểu Employee): gọi A qua OpenFeign
# ============================================================================
# ⚠️[Head] "Project Name: <StudentID>EmployeeService"
b.project=SE180211EmployeeService
# ⚠️[2.5]
b.pkg=employee
# ⚠️[Cfg] "server.port 8082"
b.port=8082
# [DTO] EmployeeDTO -> Employee
b.entity=Employee
# ⚠️[DB] "Table Name: employees"
b.table=employees
# [DTO] id ; ⚠️[DB] cột id
b.id.name=employeeId
b.id.column=employee_id
b.id.sqlType=INT
# ⚠️[API] "POST /api/employees"
b.basePath=/api/employees
# ⚠️[Head] "Controller Class: <StudentID>EmployeeController"
b.controller=SE180211EmployeeController
# [API] Get List -> lọc theo tên (EmployeeDTO field fullName)
b.list.nameField=fullName
b.list.filters=name:fullName,status:status:status
# [DTO]/[DB] status
b.status.field=status
# [DTO]/[API] "ACTIVE, LEFT, RETIRED, INACTIVE"
b.status.values=LEFT,RETIRED,ACTIVE,INACTIVE
b.status.default=ACTIVE
b.status.defaultOnCreate=true
b.status.inactive=INACTIVE
# ⚠️[DB] mỗi dòng = 1 cột trong bảng employees
b.fields=fullName,email,position,status,startDate,endDate
# full_name | Nvarchar | 100 | Yes
b.field.fullName=string,required,max=100,sql=NVARCHAR,column=full_name
# email | Nvarchar | 100 | Yes | (định dạng email)
b.field.email=string,email,required,max=100,sql=NVARCHAR,column=email
# position | Nvarchar | 30 | Yes | Manager, Developer, Staff
b.field.position=enum=Manager|Developer|Staff,required,max=30,sql=NVARCHAR,column=position
# status | Nvarchar | 10 | Yes
b.field.status=status,required,max=10,sql=NVARCHAR,column=status
# start_date | Date | Yes
b.field.startDate=date,json=dd/MM/yyyy,required,sql=DATE,column=start_date
# end_date | Date | "end_date >= start_date"
b.field.endDate=date,json=dd/MM/yyyy,geField=startDate,sql=DATE,column=end_date
# ----- Quan hệ B -> A (OpenFeign) -----
# [DTO] EmployeeDTO: "department: DepartmentDTO (Get from Department service)"
b.ref.enabled=true
# ⚠️[DB] cột FK trong bảng employees
b.ref.column=department_id
b.ref.sqlType=INT
# id phòng ban gửi lên khi tạo/sửa employee
b.ref.idProp=departmentId
# [DTO] tên object trả ra trong response
b.ref.objectProp=department
# [API của A] đường dẫn Department service
b.ref.basePath=/api/departments
b.ref.serviceUrlProp=department.service.url
b.ref.serviceUrl=http://localhost:8081
# The exam DTO exposes nested department rather than a separate departmentId field.
b.ref.inputId=false
b.ref.inputObject=true
# ============================================================================
#  GATEWAY — đọc mục "2.3 Employee Gateway"
# ============================================================================
# ⚠️[Head] "Project Name: <StudentID>EmployeeGateway"
g.project=SE180211EmployeeGateway
# ⚠️[2.5]
g.pkg=gateway
# ⚠️[Cfg] "server.port 8080"
g.port=8080
# [2.3] gateway dẫn tới DepartmentService (8081)
g.routeA.path=/api/departments/**
g.routeA.uri=http://localhost:8081
# [2.3] gateway dẫn tới EmployeeService (8082)
g.routeB.path=/api/employees/**
g.routeB.uri=http://localhost:8082
b.ref.enforceFk=false
