spring.application.name=SE181979Gateway

server.port=8080

spring.cloud.gateway.mvc.routes[0].id=department-service
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/departments/**

spring.cloud.gateway.mvc.routes[1].id=employee-service
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/employees/**

springdoc.swagger-ui.urls[0].name=Department API
springdoc.swagger-ui.urls[0].url=http://localhost:8081/v3/api-docs

springdoc.swagger-ui.urls[1].name=Employee API
springdoc.swagger-ui.urls[1].url=http://localhost:8082/v3/api-docs
# C?u hình Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html